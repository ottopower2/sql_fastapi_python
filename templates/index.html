<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Orders</title>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/payments-page">Payments</a>
      <a href="/customer-pages">Customers</a>
    </nav>

    <!-- get ordered-item by status    -->
    <label for="ordered-item-status-select">Choose a status:</label>
    <select id="loadOrderedItemStatusSelect">
      <option value="">Choose a status</option>
    </select>
    <button onclick="loadTotalOrderedItemsByStatus()">
      Load Total Ordered Items by Status
    </button>
    <ul id="total-ordered-items-list"></ul>
    <p>Total Ordered Items: <span id="total-ordered-items-count"></span></p>

    <script>
      async function loadTotalOrderedItemsByStatus() {
        const statusSelect = document.getElementById(
          'loadOrderedItemStatusSelect',
        );
        const status = statusSelect.value;

        if (!status) {
          alert('Please select a status.');
          return;
        }

        try {
          const response = await fetch(
            `/total-ordered-items-by-status?status=${encodeURIComponent(status)}`,
          );
          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }
          const data = await response.json();

          const totalOrderedItemsList = document.getElementById(
            'total-ordered-items-list',
          );
          totalOrderedItemsList.innerHTML = `<li>Total Ordered Items for status "${status}": ${data.total_ordered_items}</li>`;
          document.getElementById('total-ordered-items-count').textContent =
            data.total_ordered_items;
        } catch (error) {
          document.getElementById('total-ordered-items-list').innerHTML =
            '<li>Could not load total ordered items.</li>';
          document.getElementById('total-ordered-items-count').textContent = '';
          console.error('Error fetching total ordered items:', error);
        }
      }

      async function loadOrderedItemStatuses() {
        try {
          const response = await fetch('/order-statuses'); // fetch the order statuses from the backend endpoint order-statuses
          const data = await response.json();

          const statusSelect = document.getElementById(
            'loadOrderedItemStatusSelect',
          );
          data.order_statuses.forEach((state) => {
            const option = document.createElement('option');
            option.value = state;
            option.textContent = state;
            statusSelect.appendChild(option);
          });
        } catch (error) {
          console.error('Error fetching order statuses:', error);
        }
      }

      // Load the statuses when the page loads
      window.onload = loadOrderedItemStatuses;
    </script>
  </body>
</html>
